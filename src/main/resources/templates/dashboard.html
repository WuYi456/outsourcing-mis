<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - 外包人员管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-brand { font-weight: 700; }
        .nav-link.active { background: rgba(255,255,255,0.15); border-radius: 8px; font-weight: 600; }
        .card { border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.1) !important; }
        .stat-icon { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
        .stat-number { font-size: 28px; font-weight: 700; }
        .stat-label { font-size: 13px; color: #888; }
        .bg-gradient-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .feature-card { cursor: pointer; }
        .feature-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
<!-- ===== 导航栏 ===== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">
            <i class="bi bi-people-fill me-2"></i>外包人员管理系统
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="/dashboard"><i class="bi bi-speedometer2 me-1"></i>仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/user-management"><i class="bi bi-people me-1"></i>用户管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/applications"><i class="bi bi-file-earmark-text me-1"></i>上岗申请</a></li>
                <li class="nav-item"><a class="nav-link" href="/approval"><i class="bi bi-check2-circle me-1"></i>审批管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/performance"><i class="bi bi-star me-1"></i>绩效管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-clock-history me-1"></i>操作日志</a></li>
            </ul>
            <div class="d-flex align-items-center">
                    <span class="text-white me-3">
                        <i class="bi bi-person-circle me-1"></i>
                        <span id="usernameDisplay">加载中...</span>
                        <span class="badge bg-light text-primary ms-1" id="roleDisplay">加载中...</span>
                    </span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- ===== 主内容 ===== -->
<div class="container-fluid mt-4">

    <!-- 欢迎横幅 -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card text-white border-0 bg-gradient-primary">
                <div class="card-body py-4">
                    <h4 class="mb-1">👋 欢迎回来，<span id="welcomeName">管理员</span></h4>
                    <p class="mb-0 opacity-75">外包人员管理系统 v1.0 · 今天是 <span id="todayDate"></span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="row g-4 mb-4">
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="stat-label mb-1">总用户数</p>
                            <p class="stat-number mb-0" id="totalUsers">--</p>
                        </div>
                        <div class="stat-icon bg-primary bg-opacity-10">
                            <i class="bi bi-people text-primary fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="stat-label mb-1">待审批</p>
                            <p class="stat-number mb-0" id="pendingCount">--</p>
                        </div>
                        <div class="stat-icon bg-warning bg-opacity-10">
                            <i class="bi bi-clock-history text-warning fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="stat-label mb-1">已通过</p>
                            <p class="stat-number mb-0" id="approvedCount">--</p>
                        </div>
                        <div class="stat-icon bg-success bg-opacity-10">
                            <i class="bi bi-check-circle text-success fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="stat-label mb-1">已拒绝</p>
                            <p class="stat-number mb-0" id="rejectedCount">--</p>
                        </div>
                        <div class="stat-icon bg-danger bg-opacity-10">
                            <i class="bi bi-x-circle text-danger fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 功能入口 -->
    <div class="row g-4">
        <!-- 1. 用户管理 -->
        <div class="col-md-3 col-sm-6">
            <a href="/user-management" class="text-decoration-none">
                <div class="card shadow-sm border-0 text-center h-100 feature-card">
                    <div class="card-body py-4">
                        <div class="stat-icon bg-primary bg-opacity-10 mx-auto mb-3" style="width:60px;height:60px;">
                            <i class="bi bi-people text-primary fs-2"></i>
                        </div>
                        <h6 class="text-dark">用户管理</h6>
                        <p class="text-muted small">查看和管理系统用户</p>
                        <span class="btn btn-outline-primary btn-sm">进入 →</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- 2. 上岗申请 -->
        <div class="col-md-3 col-sm-6">
            <a href="/applications" class="text-decoration-none">
                <div class="card shadow-sm border-0 text-center h-100 feature-card">
                    <div class="card-body py-4">
                        <div class="stat-icon bg-primary bg-opacity-10 mx-auto mb-3" style="width:60px;height:60px;">
                            <i class="bi bi-file-earmark-text text-primary fs-2"></i>
                        </div>
                        <h6 class="text-dark">上岗申请</h6>
                        <p class="text-muted small">提交和管理上岗申请</p>
                        <span class="btn btn-outline-primary btn-sm">进入 →</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- 3. 审批管理 -->
        <div class="col-md-3 col-sm-6">
            <a href="/approval" class="text-decoration-none">
                <div class="card shadow-sm border-0 text-center h-100 feature-card">
                    <div class="card-body py-4">
                        <div class="stat-icon bg-success bg-opacity-10 mx-auto mb-3" style="width:60px;height:60px;">
                            <i class="bi bi-check2-circle text-success fs-2"></i>
                        </div>
                        <h6 class="text-dark">审批管理</h6>
                        <p class="text-muted small">审批上岗申请</p>
                        <span class="btn btn-outline-success btn-sm">进入 →</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- 4. 绩效管理 -->
        <div class="col-md-3 col-sm-6">
            <a href="/performance" class="text-decoration-none">
                <div class="card shadow-sm border-0 text-center h-100 feature-card">
                    <div class="card-body py-4">
                        <div class="stat-icon bg-warning bg-opacity-10 mx-auto mb-3" style="width:60px;height:60px;">
                            <i class="bi bi-star text-warning fs-2"></i>
                        </div>
                        <h6 class="text-dark">绩效管理</h6>
                        <p class="text-muted small">评定和确认绩效</p>
                        <span class="btn btn-outline-warning btn-sm">进入 →</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- 5. 操作日志 -->
        <div class="col-md-3 col-sm-6">
            <a href="/logs" class="text-decoration-none">
                <div class="card shadow-sm border-0 text-center h-100 feature-card">
                    <div class="card-body py-4">
                        <div class="stat-icon bg-info bg-opacity-10 mx-auto mb-3" style="width:60px;height:60px;">
                            <i class="bi bi-clock-history text-info fs-2"></i>
                        </div>
                        <h6 class="text-dark">操作日志</h6>
                        <p class="text-muted small">查看系统操作记录</p>
                        <span class="btn btn-outline-info btn-sm">进入 →</span>
                    </div>
                </div>
            </a>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ===== 全局变量 =====
    const TOKEN = localStorage.getItem('token');
    if (!TOKEN) window.location.href = '/login';

    // ===== 页面初始化 =====
    document.addEventListener('DOMContentLoaded', function() {
        const username = localStorage.getItem('username') || '用户';
        const role = localStorage.getItem('role') || '';
        document.getElementById('usernameDisplay').textContent = username;
        document.getElementById('welcomeName').textContent = username;
        document.getElementById('roleDisplay').textContent = role;

        const now = new Date();
        document.getElementById('todayDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
        });

        loadStats();
    });

    // ===== 加载统计数据 =====
    async function loadStats() {
        try {
            const token = localStorage.getItem('token');

            // 1. 获取用户总数（调用用户列表接口）
            try {
                const res = await fetch('/api/user/list?pageNum=1&pageSize=1', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const result = await res.json();
                if (result.code === 200 && result.data) {
                    document.getElementById('totalUsers').textContent = result.data.total || 0;
                }
            } catch (e) {
                document.getElementById('totalUsers').textContent = '--';
            }

            // 2. 获取申请统计（调用审批统计接口）
            try {
                const res = await fetch('/api/approval/statistics', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const result = await res.json();
                if (result.code === 200 && result.data) {
                    document.getElementById('pendingCount').textContent = result.data.pending || 0;
                    document.getElementById('approvedCount').textContent = result.data.approved || 0;
                    document.getElementById('rejectedCount').textContent = result.data.rejected || 0;
                }
            } catch (e) {
                // 如果统计接口不存在，从我的申请中统计
                try {
                    const appRes = await fetch('/api/job-application/my-list', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    const appResult = await appRes.json();
                    if (appResult.code === 200 && appResult.data) {
                        const pending = appResult.data.filter(a => a.status === 0).length;
                        const approved = appResult.data.filter(a => a.status === 1).length;
                        const rejected = appResult.data.filter(a => a.status === 2).length;
                        document.getElementById('pendingCount').textContent = pending;
                        document.getElementById('approvedCount').textContent = approved;
                        document.getElementById('rejectedCount').textContent = rejected;
                    }
                } catch (e2) {
                    document.getElementById('pendingCount').textContent = '--';
                    document.getElementById('approvedCount').textContent = '--';
                    document.getElementById('rejectedCount').textContent = '--';
                }
            }
        } catch (e) {
            console.error('加载统计失败', e);
        }
    }

    // ===== 退出登录 =====
    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>
</body>
</html>
