<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作日志 - 外包人员管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-brand { font-weight: 700; }
        .nav-link.active { background: rgba(255,255,255,0.15); border-radius: 8px; font-weight: 600; }
        .card { border-radius: 12px; }
        .log-code { font-size: 12px; color: #555; background: #f5f5f5; padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>
<!-- ===== 导航栏 ===== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">
            <i class="bi bi-people-fill me-2"></i>外包人员管理系统
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-1"></i>仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/user-management"><i class="bi bi-people me-1"></i>用户管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/applications"><i class="bi bi-file-earmark-text me-1"></i>上岗申请</a></li>
                <li class="nav-item"><a class="nav-link" href="/approval"><i class="bi bi-check2-circle me-1"></i>审批管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/performance"><i class="bi bi-star me-1"></i>绩效管理</a></li>
                <li class="nav-item"><a class="nav-link active" href="/logs"><i class="bi bi-clock-history me-1"></i>操作日志</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="text-white me-3"><i class="bi bi-person-circle me-1"></i><span id="usernameDisplay">用户</span></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 退出</button>
            </div>
        </div>
    </div>
</nav>

<!-- ===== 主内容 ===== -->
<div class="container-fluid mt-4">
    <h4 class="mb-4"><i class="bi bi-clock-history me-2 text-info"></i>操作日志</h4>

    <!-- 搜索条件 -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">用户名</label>
                    <input class="form-control form-control-sm" id="searchUsername" placeholder="输入用户名">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">操作类型</label>
                    <input class="form-control form-control-sm" id="searchOperation" placeholder="如 UserController.login">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">开始时间</label>
                    <input class="form-control form-control-sm" id="searchStart" type="datetime-local">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">结束时间</label>
                    <input class="form-control form-control-sm" id="searchEnd" type="datetime-local">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary btn-sm w-100" onclick="searchLogs()"><i class="bi bi-search me-1"></i>搜索</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 日志列表 -->
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-sm align-middle">
                    <thead class="table-light">
                    <tr>
                        <th style="width:100px;">用户</th>
                        <th>操作</th>
                        <th style="width:120px;">IP</th>
                        <th style="width:80px;">耗时</th>
                        <th style="width:80px;">状态</th>
                        <th style="width:160px;">时间</th>
                    </tr>
                    </thead>
                    <tbody id="logTableBody">
                    <tr><td colspan="6" class="text-center text-muted py-3">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <!-- 分页 -->
            <div class="d-flex justify-content-between align-items-center mt-3">
                <span class="text-muted small" id="pageInfo">第 0 页，共 0 页</span>
                <div>
                    <button class="btn btn-outline-secondary btn-sm" onclick="changePage(-1)" id="prevPage">上一页</button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="changePage(1)" id="nextPage">下一页</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ===== 全局变量 =====
    const TOKEN = localStorage.getItem('token');
    if (!TOKEN) window.location.href = '/login';
    document.getElementById('usernameDisplay').textContent = localStorage.getItem('username') || '用户';

    let currentPage = 0;
    let totalPages = 0;

    // ===== 页面加载 =====
    searchLogs();

    // ===== 搜索日志 =====
    async function searchLogs() {
        const username = document.getElementById('searchUsername').value.trim();
        const operation = document.getElementById('searchOperation').value.trim();
        let start = document.getElementById('searchStart').value;
        let end = document.getElementById('searchEnd').value;

        const body = {
            username: username || null,
            operation: operation || null,
            pageNum: currentPage + 1,
            pageSize: 20
        };
        if (start) body.startTime = start.replace('T', ' ');
        if (end) body.endTime = end.replace('T', ' ');

        const tbody = document.getElementById('logTableBody');

        try {
            const res = await fetch('/api/log/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + TOKEN
                },
                body: JSON.stringify(body)
            });
            const result = await res.json();

            if (result.code === 200 && result.data && result.data.content && result.data.content.length > 0) {
                const logs = result.data.content;
                totalPages = result.data.totalPages || 1;
                document.getElementById('pageInfo').textContent = `第 ${currentPage + 1} 页，共 ${totalPages} 页`;

                tbody.innerHTML = logs.map(log => `
                        <tr>
                            <td><strong>${log.username || '-'}</strong></td>
                            <td><span class="log-code">${log.operation || '-'}</span></td>
                            <td>${log.ip || '-'}</td>
                            <td>${log.duration ? log.duration + 'ms' : '-'}</td>
                            <td><span class="badge ${log.success ? 'bg-success' : 'bg-danger'}">${log.success ? '成功' : '失败'}</span></td>
                            <td class="small">${log.createTime ? log.createTime.replace('T', ' ') : '-'}</td>
                        </tr>
                    `).join('');

                document.getElementById('prevPage').disabled = currentPage === 0;
                document.getElementById('nextPage').disabled = currentPage >= totalPages - 1;
            } else {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">暂无操作日志</td></tr>';
                document.getElementById('pageInfo').textContent = '共 0 条记录';
                document.getElementById('prevPage').disabled = true;
                document.getElementById('nextPage').disabled = true;
            }
        } catch (e) {
            console.error('加载失败', e);
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">加载失败，请重试</td></tr>';
        }
    }

    // ===== 翻页 =====
    function changePage(delta) {
        const newPage = currentPage + delta;
        if (newPage < 0 || newPage >= totalPages) return;
        currentPage = newPage;
        searchLogs();
    }

    // ===== 回车搜索 =====
    document.querySelectorAll('#searchUsername, #searchOperation, #searchStart, #searchEnd').forEach(input => {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') searchLogs();
        });
    });

    // ===== 退出登录 =====
    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>
</body>
</html>
