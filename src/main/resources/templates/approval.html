<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审批管理 - 外包人员管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-brand { font-weight: 700; }
        .nav-link.active { background: rgba(255,255,255,0.15); border-radius: 8px; font-weight: 600; }
        .card { border-radius: 12px; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>
<!-- ===== 导航栏 ===== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">
            <i class="bi bi-people-fill me-2"></i>外包人员管理系统
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-1"></i>仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/user-management"><i class="bi bi-people me-1"></i>用户管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/applications"><i class="bi bi-file-earmark-text me-1"></i>上岗申请</a></li>
                <li class="nav-item"><a class="nav-link active" href="/approval"><i class="bi bi-check2-circle me-1"></i>审批管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/performance"><i class="bi bi-star me-1"></i>绩效管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-clock-history me-1"></i>操作日志</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="text-white me-3"><i class="bi bi-person-circle me-1"></i><span id="usernameDisplay">用户</span></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 退出</button>
            </div>
        </div>
    </div>
</nav>

<!-- ===== 主内容 ===== -->
<div class="container-fluid mt-4">
    <h4 class="mb-4"><i class="bi bi-check2-circle me-2 text-success"></i>待审批列表</h4>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <!-- 操作栏 -->
            <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
                <button class="btn btn-success btn-sm" onclick="batchApprove()"><i class="bi bi-check-all me-1"></i>批量通过</button>
                <button class="btn btn-danger btn-sm" onclick="batchReject()"><i class="bi bi-x-all me-1"></i>批量拒绝</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="loadPending()"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button>
                <span class="ms-auto text-muted small" id="totalCount">共 0 条待审批</span>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th style="width:40px;"><input type="checkbox" id="selectAll" onchange="toggleAll()"></th>
                        <th style="width:60px;">ID</th>
                        <th>申请人</th>
                        <th>申请理由</th>
                        <th style="width:170px;">申请时间</th>
                        <th style="width:160px;">操作</th>
                    </tr>
                    </thead>
                    <tbody id="pendingTableBody">
                    <tr><td colspan="6" class="text-center text-muted py-3">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ===== 拒绝原因弹窗 ===== -->
<div class="modal fade" id="rejectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-x-circle text-danger me-2"></i>填写拒绝原因</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <textarea class="form-control" id="rejectReason" rows="3" placeholder="请填写拒绝原因..." required></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-danger" onclick="confirmReject()"><i class="bi bi-x-circle me-1"></i>确认拒绝</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ===== 全局变量 =====
    const TOKEN = localStorage.getItem('token');
    if (!TOKEN) window.location.href = '/login';
    document.getElementById('usernameDisplay').textContent = localStorage.getItem('username') || '用户';

    let pendingList = [];
    let selectedIds = [];
    let rejectTargetId = null;

    // ===== 页面加载 =====
    loadPending();

    // ===== 加载待审批列表 =====
    async function loadPending() {
        try {
            const res = await fetch('/api/approval/pending?pageNum=1&pageSize=50', {
                headers: { 'Authorization': 'Bearer ' + TOKEN }
            });
            const result = await res.json();
            const tbody = document.getElementById('pendingTableBody');

            if (result.code === 200 && result.data && result.data.list && result.data.list.length > 0) {
                pendingList = result.data.list;
                document.getElementById('totalCount').textContent = `共 ${pendingList.length} 条待审批`;
                tbody.innerHTML = pendingList.map(app => `
                        <tr>
                            <td><input type="checkbox" class="row-checkbox" value="${app.id}" onchange="updateSelected()"></td>
                            <td>#${app.id}</td>
                            <td><strong>${app.applicantName}</strong></td>
                            <td>${app.reason || '-'}</td>
                            <td>${app.applyTime ? app.applyTime.replace('T', ' ') : '-'}</td>
                            <td>
                                <button class="btn btn-sm btn-success me-1" onclick="approve(${app.id})"><i class="bi bi-check2"></i> 通过</button>
                                <button class="btn btn-sm btn-danger" onclick="showRejectModal(${app.id})"><i class="bi bi-x"></i> 拒绝</button>
                            </td>
                        </tr>
                    `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">暂无待审批申请</td></tr>';
                document.getElementById('totalCount').textContent = '共 0 条待审批';
            }
        } catch (e) {
            console.error('加载失败', e);
        }
    }

    // ===== 全选 =====
    function toggleAll() {
        const checked = document.getElementById('selectAll').checked;
        document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = checked);
        updateSelected();
    }

    // ===== 更新选中列表 =====
    function updateSelected() {
        selectedIds = [];
        document.querySelectorAll('.row-checkbox:checked').forEach(cb => {
            selectedIds.push(parseInt(cb.value));
        });
    }

    // ===== 单个审批通过 =====
    async function approve(id) {
        if (!confirm('确认通过此申请？')) return;
        try {
            const res = await fetch('/api/approval/approve', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + TOKEN
                },
                body: JSON.stringify({ applicationId: id })
            });
            const result = await res.json();
            if (result.code === 200) {
                alert('✅ 审批通过');
                loadPending();
            } else {
                alert('❌ ' + result.msg);
            }
        } catch (e) {
            alert('网络错误');
        }
    }

    // ===== 显示拒绝弹窗 =====
    function showRejectModal(id) {
        rejectTargetId = id;
        document.getElementById('rejectReason').value = '';
        new bootstrap.Modal(document.getElementById('rejectModal')).show();
    }

    // ===== 确认拒绝 =====
    async function confirmReject() {
        const reason = document.getElementById('rejectReason').value.trim();
        if (!reason) {
            alert('请填写拒绝原因');
            document.getElementById('rejectReason').focus();
            return;
        }
        try {
            const res = await fetch('/api/approval/reject', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + TOKEN
                },
                body: JSON.stringify({
                    applicationId: rejectTargetId,
                    rejectReason: reason
                })
            });
            const result = await res.json();
            if (result.code === 200) {
                alert('✅ 已拒绝');
                bootstrap.Modal.getInstance(document.getElementById('rejectModal')).hide();
                loadPending();
            } else {
                alert('❌ ' + result.msg);
            }
        } catch (e) {
            alert('网络错误');
        }
    }

    // ===== 批量审批通过 =====
    async function batchApprove() {
        if (selectedIds.length === 0) {
            alert('请至少选择一个申请');
            return;
        }
        if (!confirm(`确认通过 ${selectedIds.length} 个申请？`)) return;
        try {
            const res = await fetch('/api/approval/batch-approve', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + TOKEN
                },
                body: JSON.stringify({ applicationIds: selectedIds })
            });
            const result = await res.json();
            if (result.code === 200) {
                alert('✅ 批量审批通过');
                loadPending();
            } else {
                alert('❌ ' + result.msg);
            }
        } catch (e) {
            alert('网络错误');
        }
    }

    // ===== 批量拒绝 =====
    async function batchReject() {
        if (selectedIds.length === 0) {
            alert('请至少选择一个申请');
            return;
        }
        const reason = prompt('请填写拒绝原因：');
        if (reason === null) return;
        if (!reason.trim()) {
            alert('请填写拒绝原因');
            return;
        }
        if (!confirm(`确认拒绝 ${selectedIds.length} 个申请？`)) return;
        try {
            const res = await fetch('/api/approval/batch-reject', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + TOKEN
                },
                body: JSON.stringify({
                    applicationIds: selectedIds,
                    rejectReason: reason.trim()
                })
            });
            const result = await res.json();
            if (result.code === 200) {
                alert('✅ 批量拒绝成功');
                loadPending();
            } else {
                alert('❌ ' + result.msg);
            }
        } catch (e) {
            alert('网络错误');
        }
    }

    // ===== 退出登录 =====
    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>
</body>
</html>
